# Разворачивает бота (bot/) на Cloudflare Workers и подключает его к Telegram.
# Нужны секреты репозитория: CLOUDFLARE_API_TOKEN и TELEGRAM_BOT_TOKEN
# (необязательно: CLOUDFLARE_ACCOUNT_ID, если у токена доступ к нескольким аккаунтам).
name: Deploy bot

on:
  push:
    branches: [main]
    paths: ['bot/**', '.github/workflows/bot.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check secrets
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::Добавьте секрет CLOUDFLARE_API_TOKEN"; exit 1; }
          [ -n "$BOT_TOKEN" ] || { echo "::error::Добавьте секрет TELEGRAM_BOT_TOKEN"; exit 1; }

      - name: Ensure workers.dev subdomain
        run: |
          # На новом аккаунте нет поддомена *.workers.dev — регистрируем его сами
          api=https://api.cloudflare.com/client/v4
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          acc="$CLOUDFLARE_ACCOUNT_ID"
          [ -n "$acc" ] || acc=$(curl -sS -H "$auth" "$api/accounts" | jq -r '.result[0].id // empty')
          [ -n "$acc" ] || { echo "::error::Не удалось получить аккаунт Cloudflare — проверьте CLOUDFLARE_API_TOKEN"; exit 1; }
          sub=$(curl -sS -H "$auth" "$api/accounts/$acc/workers/subdomain" | jq -r '.result.subdomain // empty')
          if [ -z "$sub" ]; then
            owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr 'A-Z' 'a-z')
            for name in "$owner" "$owner-bots" "six-weeks-$RANDOM$RANDOM"; do
              r=$(curl -sS -X PUT -H "$auth" -H 'content-type: application/json' \
                "$api/accounts/$acc/workers/subdomain" -d "{\"subdomain\":\"$name\"}")
              echo "$name: $(echo "$r" | jq -c '{success, errors}')"
              if [ "$(echo "$r" | jq -r .success)" = true ]; then sub=$name; break; fi
            done
          fi
          [ -n "$sub" ] || { echo "::error::Не удалось создать поддомен workers.dev"; exit 1; }
          echo "Поддомен: $sub.workers.dev"

      - name: Deploy worker
        id: deploy
        run: |
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || unset CLOUDFLARE_ACCOUNT_ID
          npx --yes wrangler@4 deploy | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          [ -n "$url" ] || { echo "::error::Не найден адрес воркера в выводе wrangler"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Set webhook secret
        run: |
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || unset CLOUDFLARE_ACCOUNT_ID
          # секрет выводится из токена бота — отдельно хранить не нужно
          secret=$(printf '%s' "$BOT_TOKEN" | sha256sum | cut -c1-64)
          echo "::add-mask::$secret"
          printf '%s' "$secret" | npx --yes wrangler@4 secret put WEBHOOK_SECRET
          echo "WEBHOOK_SECRET=$secret" >> "$GITHUB_ENV"

      - name: Connect Telegram
        env:
          WORKER_URL: ${{ steps.deploy.outputs.url }}
        run: |
          api="https://api.telegram.org/bot$BOT_TOKEN"
          check() { echo "$1"; echo "$1" | grep -q '"ok":true' || exit 1; }
          check "$(curl -sS "$api/setWebhook" \
            --data-urlencode "url=$WORKER_URL" \
            -d "secret_token=$WEBHOOK_SECRET" \
            --data-urlencode 'allowed_updates=["message"]')"
          check "$(curl -sS "$api/setMyCommands" -H 'content-type: application/json' \
            -d '{"commands":[{"command":"start","description":"Начать"},{"command":"feedback","description":"Предложить идею"}]}')"
