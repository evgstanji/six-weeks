<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>Тренировки</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Палитра: жёлтый, чёрный, белый — не зависит от темы Telegram */
:root {
  color-scheme: dark;
  --bg: #000000;
  --text: #ffffff;
  --hint: #8e8e93;
  --accent: #ffcc00;
  --accent-text: #000000;
  --card: #161616;
  --card2: #262626;
  --link: #ffcc00;
  --danger: #ff6b5e;
  --ok: #ffcc00;
  --line: rgba(255, 255, 255, 0.12);
  --r: 18px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body {
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  overscroll-behavior-y: none;
  -webkit-font-smoothing: antialiased;
}
#app {
  max-width: 520px; margin: 0 auto;
  padding: 16px 16px calc(112px + env(safe-area-inset-bottom));
  min-height: 100vh;
}
h1 { font-size: 24px; line-height: 1.2; margin: 4px 0 4px; letter-spacing: -0.3px; }
h2 { font-size: 18px; margin: 24px 0 10px; }
h3 { font-size: 16px; margin: 0; }
p { margin: 0 0 12px; }
.hint { color: var(--hint); }
.small { font-size: 13px; }
.center { text-align: center; }
.row { display: flex; align-items: center; gap: 12px; }
.grow { flex: 1; min-width: 0; }
.mt { margin-top: 16px; }

.card {
  background: var(--card); border-radius: var(--r);
  padding: 16px; margin-bottom: 12px;
}
.card.tap { cursor: pointer; }
.card.tap:active { opacity: .7; }
.prog { display: flex; gap: 14px; align-items: center; }
.ico {
  width: 52px; height: 52px; border-radius: 14px; flex: none;
  display: grid; place-items: center; font-size: 28px; overflow: hidden;
}
.ico img, .ico svg { width: 100%; height: 100%; display: block; }
.ico.lg { width: 60px; height: 60px; border-radius: 16px; }
.ico-inline svg { width: 100%; height: 100%; display: block; }
.btn.danger-solid { background: var(--danger); color: #000; }
.ico-inline { overflow: hidden; width: 22px; height: 22px; border-radius: 6px; vertical-align: -5px; margin-right: 6px; }
.chev { color: var(--hint); font-size: 24px; }
.bar-track { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 8px; }
.bar-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width .3s; }

.badge {
  display: inline-block; font-size: 12px; font-weight: 600;
  padding: 2px 8px; border-radius: 10px;
  background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent);
}
.badge.ok { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
.badge.mute { background: var(--line); color: var(--hint); }

button {
  font: inherit; border: 0; cursor: pointer; color: inherit;
  background: none; padding: 0;
}
.btn {
  display: block; width: 100%; text-align: center;
  background: var(--accent); color: var(--accent-text);
  font-weight: 600; font-size: 17px;
  padding: 15px 18px; border-radius: 14px;
}
.btn:active { opacity: .8; }
.btn.sec { background: var(--card); color: var(--text); }
.btn.ghost { background: transparent; color: var(--link); font-weight: 500; padding: 10px; }
.btn.danger { background: transparent; color: var(--danger); font-weight: 500; padding: 10px; }
.btn.small { font-size: 15px; padding: 10px 14px; width: auto; display: inline-block; }
.bottom {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  background: linear-gradient(to top, var(--bg) 70%, transparent);
}
.bottom > div { max-width: 520px; margin: 0 auto; display: grid; gap: 8px; }

/* степпер */
.stepper { display: flex; align-items: center; justify-content: center; gap: 18px; margin: 14px 0 4px; }
.stepper button {
  width: 56px; height: 56px; border-radius: 50%;
  background: var(--card2); color: var(--text); font-size: 30px; line-height: 1; font-weight: 500;
}
.stepper button:active { background: var(--accent); color: var(--accent-text); }
.stepper input {
  width: 110px; text-align: center; font-size: 44px; font-weight: 700;
  background: transparent; border: 0; color: var(--text); font-family: inherit;
  -moz-appearance: textfield; appearance: textfield; padding: 0;
}
.stepper input::-webkit-outer-spin-button,
.stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.stepper input:focus { outline: none; }
.stepper .val { font-size: 56px; font-weight: 700; min-width: 100px; text-align: center; font-variant-numeric: tabular-nums; }

/* подходы */
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
.chip {
  min-width: 40px; text-align: center; padding: 6px 10px; border-radius: 10px;
  font-weight: 600; font-variant-numeric: tabular-nums;
  background: var(--card); color: var(--hint);
}
.chip.cur { background: var(--accent); color: var(--accent-text); }
.chip.done { background: rgba(255, 204, 0, 0.16); color: var(--accent); }
.chip.low { background: rgba(255, 255, 255, 0.14); color: #fff; }
/* чипы на всю ширину экрана тренировки */
.chips.full { flex-wrap: nowrap; gap: 6px; }
.chips.full .chip { flex: 1 1 0; min-width: 0; padding: 10px 0; font-size: 17px; border-radius: 12px; }
.counter-label { font-weight: 600; margin-bottom: 2px; }
.target { font-size: 72px; font-weight: 800; line-height: 1; letter-spacing: -2px; }
.sets-list { margin-top: 4px; }
.sets-list div {
  display: flex; justify-content: space-between; padding: 9px 0;
  border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums;
}
.sets-list div:last-child { border-bottom: 0; }

/* таймер */
.ring-wrap { position: relative; width: 240px; height: 240px; margin: 12px auto; }
.ring-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring-bg { stroke: var(--line); }
.ring-fg { stroke: var(--accent); transition: stroke-dashoffset .25s linear; }
.ring-text {
  position: absolute; inset: 0; display: grid; place-content: center; text-align: center;
}
.ring-text .t { font-size: 56px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.adj { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* план */
.week-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.day {
  display: flex; align-items: flex-start; gap: 10px; padding: 9px 0;
  border-top: 1px solid var(--line);
}
.day .dot {
  width: 24px; height: 24px; border-radius: 50%; flex: none; margin-top: 1px;
  display: grid; place-items: center; font-size: 13px; font-weight: 700;
  box-shadow: inset 0 0 0 1.5px var(--line); color: var(--hint);
}
.day.done .dot { background: var(--accent); color: var(--accent-text); box-shadow: none; }
.day.next .dot { box-shadow: inset 0 0 0 2px var(--accent); color: var(--accent); }
.day .sets { font-variant-numeric: tabular-nums; font-weight: 600; }
.card.dim { opacity: .55; }
.banner {
  background: rgba(255, 204, 0, 0.14); color: var(--accent);
  border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; font-size: 14px;
}

/* статистика */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.tile { background: var(--card); border-radius: var(--r); padding: 14px; }
.tile .n { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
.chart text { fill: var(--hint); font-size: 11px; font-family: inherit; }
.chart .v { fill: var(--text); font-weight: 700; font-size: 13px; }
.chart .bar { fill: var(--accent); }
.chart .goal { stroke: rgba(255, 255, 255, 0.6); stroke-dasharray: 4 4; }
.chart .goal-t { fill: #fff; }

/* свой диалог подтверждения вместо системного confirm */
.sheet-bg {
  position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, 0.7);
  display: flex; align-items: flex-end; justify-content: center;
  animation: fade .15s ease;
}
.sheet {
  width: 100%; max-width: 520px; background: #1c1c1e;
  border-radius: 22px 22px 0 0; display: grid; gap: 10px;
  padding: 22px 16px calc(16px + env(safe-area-inset-bottom));
}
.sheet p { text-align: center; margin: 0 0 6px; font-size: 17px; }
.logrow { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 15px; }
.logrow:first-child { border-top: 0; }

.big-emoji { font-size: 64px; text-align: center; margin: 8px 0; }
/* только opacity: transform у родителя ломает position: fixed у нижней кнопки */
.fade { animation: fade .18s ease; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.day .sets { margin-left: 6px; }
.logrow .small { margin-left: 6px; }

</style>
</head>

<script>
/* Чистая логика программы: без DOM и без Telegram. Проверяется на node. */
(function (root) {
  'use strict';

  var DAYS_PER_WEEK = 3;

  function tierNum(id) { return parseInt(String(id).replace('tier_', ''), 10); }

  function tierRange(t) {
    if (t.max_reps == null) return t.min_reps + '+';
    return t.min_reps + '–' + t.max_reps;
  }

  function findTier(P, reps) {
    var tiers = P.initial_test.tiers;
    for (var i = 0; i < tiers.length; i++) {
      var t = tiers[i];
      if (reps >= t.min_reps && (t.max_reps == null || reps <= t.max_reps)) return t;
    }
    return tiers[tiers.length - 1];
  }

  function weekDef(P, w) {
    for (var i = 0; i < P.weeks.length; i++) if (P.weeks[i].week_number === w) return P.weeks[i];
    return null;
  }

  function newState(P, reps, now) {
    var t = findTier(P, reps);
    return {
      v: 1,
      p: P.program_id,
      m: reps,                       // стартовый максимум
      sw: t.start_week,              // с какой недели начинаем
      st: t.target_tier_on_start || t.tier_id, // уровень на старте
      s0: now,                       // дата старта
      d: {},                         // выполненные тренировки: "нед-день" -> {t, k, r}
      T: {},                         // результаты контрольных: неделя -> {r, n, t} или {x:1, n}
      a: null,                       // тренировка в процессе
      ar: { r: 0, w: 0 },            // архив повторённых недель (повторы, тренировки)
      f: false,                      // программа завершена
      u: now
    };
  }

  // Уровень, по которому идёт неделя w: стартовый, затем меняется после каждого контрольного теста
  function tierAtWeek(P, st, w) {
    var t = st.st;
    for (var i = 0; i < P.weeks.length; i++) {
      var wk = P.weeks[i];
      if (wk.week_number >= w) break;
      var r = st.T[wk.week_number];
      if (r && r.n) t = r.n;
    }
    return t;
  }

  function getWorkout(P, st, w, d, tierOverride) {
    var wk = weekDef(P, w);
    var day = null;
    for (var i = 0; i < wk.days.length; i++) if (wk.days[i].day_number === d) day = wk.days[i];
    var tier = tierOverride || tierAtWeek(P, st, w);
    var cfg = day.tiers[tier];
    return {
      week: w, day: d, tier: tier,
      sets: cfg.sets.slice(),
      rest: cfg.rest_seconds.slice(),
      amrapLast: !!cfg.amrap_last_set
    };
  }

  function key(w, d) { return w + '-' + d; }

  function nextAction(P, st) {
    if (st.f) return { type: 'finished' };
    for (var i = 0; i < P.weeks.length; i++) {
      var wk = P.weeks[i];
      if (wk.week_number < st.sw) continue;
      for (var j = 0; j < wk.days.length; j++) {
        var dn = wk.days[j].day_number;
        if (!st.d[key(wk.week_number, dn)]) return { type: 'workout', week: wk.week_number, day: dn };
      }
      if (wk.benchmark_test_after_week && !st.T[wk.week_number]) {
        return { type: 'test', week: wk.week_number };
      }
    }
    return { type: 'finished' };
  }

  function totalWorkouts(P, st) {
    var n = 0;
    P.weeks.forEach(function (wk) { if (wk.week_number >= st.sw) n += wk.days.length; });
    return n;
  }

  function doneWorkouts(P, st) {
    var n = 0;
    Object.keys(st.d).forEach(function (k) { if (parseInt(k, 10) >= st.sw) n++; });
    return n;
  }

  function sum(a) { return a.reduce(function (x, y) { return x + y; }, 0); }

  function completeWorkout(P, st, w, d, reps, now) {
    var wo = getWorkout(P, st, w, d);
    st.d[key(w, d)] = { t: now, k: tierNum(wo.tier), r: reps.slice() };
    st.a = null;
    st.u = now;
    return st.d[key(w, d)];
  }

  function transitionsFor(P, w) {
    var wk = weekDef(P, w);
    return (wk && wk.benchmark_test_after_week && wk.benchmark_test_after_week.transitions) || null;
  }

  function finalTarget(P, w) {
    var wk = weekDef(P, w);
    var b = wk && wk.benchmark_test_after_week;
    return b && b.target_reps != null ? b.target_reps : null;
  }

  function applyTest(P, st, w, reps, now) {
    var tr = transitionsFor(P, w);
    var rec = { r: reps, t: now };
    if (tr) {
      for (var i = 0; i < tr.length; i++) {
        var x = tr[i];
        if (reps >= x.min_reps && (x.max_reps == null || reps <= x.max_reps)) { rec.n = x.next_tier; break; }
      }
    } else {
      st.f = true; // финальный тест
    }
    st.T[w] = rec;
    st.u = now;
    return rec;
  }

  function skipTest(P, st, w, now) {
    st.T[w] = { x: 1, n: tierAtWeek(P, st, w + 1), t: now };
    st.u = now;
  }

  // Повтор недели: тренировки уходят в архив (их повторения остаются в общей сумме)
  function resetWeek(P, st, w, now) {
    var wk = weekDef(P, w);
    wk.days.forEach(function (day) {
      var k = key(w, day.day_number);
      var rec = st.d[k];
      if (rec) {
        st.ar.r += sum(rec.r);
        st.ar.w += 1;
        delete st.d[k];
      }
    });
    if (finalTarget(P, w) != null) { delete st.T[w]; st.f = false; }
    if (st.a && st.a.k && parseInt(st.a.k, 10) === w) st.a = null;
    st.u = now;
  }

  function totalReps(st) {
    var n = st.ar.r;
    Object.keys(st.d).forEach(function (k) { n += sum(st.d[k].r); });
    return n;
  }

  function lastWorkoutTime(st) {
    var t = 0;
    Object.keys(st.d).forEach(function (k) { if (st.d[k].t > t) t = st.d[k].t; });
    return t;
  }

  function plannedFor(P, st, w, d, rec) {
    return getWorkout(P, st, w, d, 'tier_' + rec.k).sets;
  }

  function shortfalls(planned, reps) {
    var n = 0;
    for (var i = 0; i < planned.length; i++) if ((reps[i] || 0) < planned[i]) n++;
    return n;
  }

  // Лучший результат: стартовый максимум и все контрольные тесты
  function bestMax(st) {
    var b = st.m;
    Object.keys(st.T).forEach(function (w) { if (st.T[w].r != null && st.T[w].r > b) b = st.T[w].r; });
    return b;
  }

  var L = {
    DAYS_PER_WEEK: DAYS_PER_WEEK,
    tierNum: tierNum, tierRange: tierRange, findTier: findTier, weekDef: weekDef,
    newState: newState, tierAtWeek: tierAtWeek, getWorkout: getWorkout, key: key,
    nextAction: nextAction, totalWorkouts: totalWorkouts, doneWorkouts: doneWorkouts,
    completeWorkout: completeWorkout, transitionsFor: transitionsFor, finalTarget: finalTarget,
    applyTest: applyTest, skipTest: skipTest, resetWeek: resetWeek, totalReps: totalReps,
    lastWorkoutTime: lastWorkoutTime, plannedFor: plannedFor, shortfalls: shortfalls,
    bestMax: bestMax, sum: sum
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = L;
  else root.Logic = L;
})(typeof window !== 'undefined' ? window : globalThis);

</script>

  let curReps = 0, curRepsKey = '';

  /* ---------- утилиты ---------- */
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const sum = L.sum;
  const mmss = (s) => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  const dateStr = (ts) => new Date(ts).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
  const sameDay = (a, b) => new Date(a).toDateString() === new Date(b).toDateString();
  const fmtSets = (sets, amrap) => sets.map((n, i) => (amrap && i === sets.length - 1 ? n + '+' : n)).join(' · ');
  const tn = L.tierNum;

  function haptic(kind, style) {
    try {
      if (!tg || !tg.HapticFeedback) return;
      if (kind === 'n') tg.HapticFeedback.notificationOccurred(style || 'success');
      else tg.HapticFeedback.impactOccurred(style || 'light');
    } catch (e) { /* нет поддержки */ }
  }

  // Свой диалог: системные confirm/alert блокируются в некоторых WebView и превью,
  // из-за этого «Повторить неделю» могло молча не срабатывать.
  function sheet(msg, buttons) {
    const old = document.querySelector('.sheet-bg');
    if (old) old.remove();
    const bg = document.createElement('div');
    bg.className = 'sheet-bg';
    bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><p>${esc(msg)}</p>` +
      buttons.map((b, i) => `<button class="btn ${b.cls || ''}" data-i="${i}">${esc(b.label)}</button>`).join('') + '</div>';
    const close = () => bg.remove();
    bg.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-i]');
      if (btn) { close(); const f = buttons[+btn.dataset.i].fn; if (f) f(); return; }
      if (e.target === bg) close();
    });
    document.body.appendChild(bg);
    haptic('i', 'light');
  }

  function notify(msg) { sheet(msg, [{ label: 'Понятно' }]); }

  function confirmBox(msg, ok, okLabel, danger) {
    sheet(msg, [
      { label: okLabel || 'Да', fn: ok, cls: danger ? 'danger-solid' : '' },
      { label: 'Отмена', cls: 'sec' }
    ]);
  }

  /* ---------- звук и экран ---------- */
  let actx = null;
  function unlockAudio() {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!actx) actx = new AC();
      if (actx.state === 'suspended') actx.resume();
    } catch (e) { /* ignore */ }
  }
  function beep(times) {
    try {
      if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
    } catch (e) { /* ignore */ }
    if (!actx) return;
    try {
      const t0 = actx.currentTime;
      for (let i = 0; i < (times || 3); i++) {
        const o = actx.createOscillator();
        const g = actx.createGain();
        const s = t0 + i * 0.24;
        o.type = 'sine';
        o.frequency.value = 880;
        g.gain.setValueAtTime(0.0001, s);
        g.gain.exponentialRampToValueAtTime(0.35, s + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, s + 0.18);
        o.connect(g); g.connect(actx.destination);
        o.start(s); o.stop(s + 0.2);
      }
    } catch (e) { /* ignore */ }
  }

  let wl = null;
  function lockScreen() {
    try {
      if (navigator.wakeLock && !wl) {
        navigator.wakeLock.request('screen').then((s) => {
          wl = s;
          s.addEventListener('release', () => { wl = null; });
        }).catch(() => {});
      }
    } catch (e) { /* ignore */ }
  }
  function unlockScreen() {
    try { if (wl) { wl.release(); wl = null; } } catch (e) { /* ignore */ }
  }

  /* ---------- хранилище: CloudStorage Telegram + localStorage ---------- */
  const LS = 'tw6_';
  const lsGet = (k) => { try { return localStorage.getItem(LS + k); } catch (e) { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(LS + k, v); } catch (e) { /* ignore */ } };
  const lsDel = (k) => { try { localStorage.removeItem(LS + k); } catch (e) { /* ignore */ } };
  const cloudOK = () => !!(tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9'));
  const parse = (s) => { try { return s ? JSON.parse(s) : null; } catch (e) { return null; } };

  function cloudGet(k) {
    return new Promise((resolve) => {
      if (!cloudOK()) return resolve(null);
      let done = false;
      const to = setTimeout(() => { if (!done) { done = true; resolve(null); } }, 2500);
      try {
        tg.CloudStorage.getItem(k, (err, val) => {
          if (done) return;
          done = true; clearTimeout(to);
          resolve(!err && val ? val : null);
        });
      } catch (e) { done = true; clearTimeout(to); resolve(null); }
    });
  }
  function cloudSet(k, v) { if (cloudOK()) { try { tg.CloudStorage.setItem(k, v, () => {}); } catch (e) { /* ignore */ } } }
  function cloudDel(k) { if (cloudOK()) { try { tg.CloudStorage.removeItem(k, () => {}); } catch (e) { /* ignore */ } } }

  function loadAll() {
    return Promise.all(ORDER.map((id) => cloudGet(id).then((c) => {
      const a = parse(c), b = parse(lsGet(id));
      ST[id] = a && b ? (a.u >= b.u ? a : b) : (a || b || null);
    })));
  }

  function persist(id) {
    const st = ST[id];
    if (!st) { lsDel(id); cloudDel(id); return; }
    st.u = Date.now();
    const s = JSON.stringify(st);
    lsSet(id, s);
    if (s.length < 4000) cloudSet(id, s); // лимит значения CloudStorage — 4096 символов
  }

  /* ---------- навигация ---------- */
  const cur = () => stack[stack.length - 1];
  function go(v, p) { stack.push(Object.assign({ v }, p || {})); render(); }
  function replace(v, p) { stack[stack.length - 1] = Object.assign({ v }, p || {}); render(); }
  function resetTo(arr) { stack = arr; render(); }
  function back() { if (stack.length > 1) { stack.pop(); render(); } }

  function backLink() {
    if (insideTelegram || stack.length < 2) return '';
    return '<button class="btn ghost small" data-act="back" style="padding-left:0">‹ Назад</button>';
  }

  /* ---------- общие куски разметки ---------- */
  function stepperInput(id, val) {
    return `<div class="stepper">
      <button data-act="step" data-t="${id}" data-d="-1" aria-label="Минус">−</button>
      <input id="${id}" type="number" inputmode="numeric" pattern="[0-9]*" min="0" max="999" value="${val}">
      <button data-act="step" data-t="${id}" data-d="1" aria-label="Плюс">+</button>
    </div>`;
  }

  function bottom(html) { return `<div class="bottom"><div>${html}</div></div>`; }

  function testNumber(P, w) {
    let n = 0;
    for (const wk of P.weeks) {
      const b = wk.benchmark_test_after_week;
      if (b && b.target_reps == null) n++;
      if (wk.week_number === w) return n;
    }
    return n;
  }

  function levelRange(r) {
    return r.max_reps == null ? r.min_reps + '+' : r.min_reps + '–' + r.max_reps;
  }

  /* ---------- экраны ---------- */
  const VIEWS = {};
  const AFTER = {};

  VIEWS.home = function () {
    let h = `<h1>Выберите программу</h1>
      <p class="hint">6 недель, 3 тренировки в неделю.</p><div class="mt"></div>`;
    ORDER.forEach((id) => {
      const P = DATA[id], m = META[id], st = ST[id];
      let sub = `Цель: ${m.goalText} · 6 недель`, bar = '';
      if (st) {
        const done = L.doneWorkouts(P, st), total = L.totalWorkouts(P, st);
        if (st.f) {
          const fin = st.T[6];
          sub = `<span class="badge ok">Завершено</span> финальный тест: ${fin ? fin.r : '—'}`;
        } else {
          const a = L.nextAction(P, st);
          const where = a.type === 'workout' ? `Неделя ${a.week} · День ${a.day}` : `Контрольный тест`;
          sub = `Дальше: ${where}`;
        }
        bar = `<div class="bar-track"><div class="bar-fill" style="width:${Math.round(done / total * 100)}%"></div></div>
               <div class="hint small" style="margin-top:4px">Тренировок: ${done} из ${total}</div>`;
      }
      h += `<div class="card tap prog" data-act="open" data-id="${id}">
        <div class="ico">${icon(id)}</div>
        <div class="grow"><h3>${m.name}</h3><div class="hint small">${sub}</div>${bar}</div>
        <div class="chev">›</div></div>`;
    });
    h += `<p class="hint small center" style="margin-top:20px">Прогресс хранится в вашем Telegram-аккаунте и доступен на всех устройствах.</p>`;
    return h;
  };

  VIEWS.setup = function (c) {
    const m = META[c.id];
    return `${backLink()}
      <div class="row" style="margin-bottom:8px"><div class="ico lg">${icon(c.id)}</div><h1 class="grow">${m.name}</h1></div>
      <p class="hint">Цель: ${m.goalText}</p>
      <div class="card center">
        <h3>Стартовый тест</h3>
        <p class="hint small" style="margin:6px 0 0">Разомнитесь и сделайте максимум повторений в одном подходе до отказа — чисто, без рывков. Введите результат.</p>
        ${stepperInput('num', m.defaultMax)}
        <div id="tierPrev" style="margin-top:12px"></div>
      </div>
      ${bottom('<button class="btn" data-act="start">Начать программу</button>')}`;
  };
  AFTER.setup = updateTierPrev;

  function updateTierPrev() {
    const c = cur();
    const el = document.getElementById('tierPrev');
    const inp = document.getElementById('num');
    if (!el || !inp) return;
    const P = DATA[c.id];
    const n = Math.max(0, parseInt(inp.value, 10) || 0);
    const t = L.findTier(P, n);
    const lvl = tn(t.target_tier_on_start || t.tier_id);
    let html;
    if (t.start_week > 1) {
      html = `Ваш результат выше стартовых уровней. Начнём сразу с <b>недели ${t.start_week}</b>, уровень <b>${lvl}</b>.`;
    } else {
      html = `Ваш уровень: <b>${lvl}</b> <span class="hint">(тест ${L.tierRange(t)})</span>`;
    }
    if (t.note) html += `<p class="hint small" style="margin-top:8px">${esc(t.note)}</p>`;
    el.innerHTML = html;
  }

  VIEWS.program = function (c) {
    const id = c.id, P = DATA[id], m = META[id], st = ST[id];
    const act = L.nextAction(P, st);
    const done = L.doneWorkouts(P, st), total = L.totalWorkouts(P, st);
    let h = `${backLink()}
      <div class="row"><div class="ico lg">${icon(id)}</div>
      <div class="grow"><h1>${m.name}</h1><div class="hint small">Цель: ${m.goalText}</div></div></div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round(done / total * 100)}%"></div></div>
      <div class="hint small" style="margin:4px 0 16px">Тренировок: ${done} из ${total}</div>`;

    const last = L.lastWorkoutTime(st);
    if (act.type !== 'finished' && last && sameDay(last, Date.now())) {
      h += `<div class="banner">Сегодня вы уже тренировались. Между тренировками нужен хотя бы день отдыха.</div>`;
    }

    let cta = '';
    if (act.type === 'workout') {
      const wo = L.getWorkout(P, st, act.week, act.day);
      const resume = st.a && st.a.k === L.key(act.week, act.day) && st.a.i > 0;
      h += `<div class="card">
        <div class="hint small">${resume ? 'Тренировка в процессе' : 'Следующая тренировка'}</div>
        <h3 style="margin:2px 0 8px">Неделя ${act.week} · День ${act.day}</h3>
        <div style="font-size:22px;font-weight:700">${fmtSets(wo.sets, wo.amrapLast)}</div>
        <div class="hint small" style="margin-top:6px">Всего от ${sum(wo.sets)} повторений · отдых ${wo.rest[0]} с</div>
      </div>`;
      cta = `<button class="btn" data-act="start-workout" data-w="${act.week}" data-d="${act.day}">${resume ? 'Продолжить тренировку' : 'Начать тренировку'}</button>`;
    } else if (act.type === 'test') {
      const fin = L.finalTarget(P, act.week);
      h += `<div class="card"><div class="hint small">Следующий шаг</div>
        <h3 style="margin:2px 0 6px">${fin != null ? 'Финальный тест' : 'Контрольный тест ' + testNumber(P, act.week)}</h3>
        <div class="hint">${fin != null ? 'Один подход до абсолютного отказа. Цель — ' + fin + '.' : 'Один подход до отказа. Результат определит уровень следующих недель.'}</div></div>`;
      cta = `<button class="btn" data-act="open-test" data-w="${act.week}">Пройти тест</button>`;
    } else {
      const fin = st.T[6];
      const goal = L.finalTarget(P, 6);
      h += `<div class="card center"><div class="big-emoji">${fin && fin.r >= goal ? '🏆' : '🏁'}</div>
        <h3>Программа завершена</h3>
        <p class="hint" style="margin:6px 0 0">Финальный результат: <b>${fin ? fin.r : '—'}</b> из ${goal}</p></div>`;
    }

    h += `<h2>План</h2><p class="hint small" style="margin:-4px 0 10px">Уровень — это нагрузка подходов. Он выбирается по стартовому тесту и обновляется после контрольных тестов.</p>`;

    const pendingFrom = (w) => P.weeks.some((x) => x.benchmark_test_after_week && x.week_number >= st.sw && x.week_number < w && !st.T[x.week_number]);

    P.weeks.forEach((wk) => {
      const w = wk.week_number;
      const skipped = w < st.sw;
      const tier = L.tierAtWeek(P, st, w);
      const prelim = !skipped && pendingFrom(w);
      let anyDone = false;
      let body = '';
      if (skipped) {
        body = `<div class="hint small">Пропущена: вы начинаете сразу с недели ${st.sw}.</div>`;
      } else {
        wk.days.forEach((day) => {
          const dn = day.day_number, k = L.key(w, dn), rec = st.d[k];
          const isNext = act.type === 'workout' && act.week === w && act.day === dn;
          if (rec) {
            anyDone = true;
            const planned = L.plannedFor(P, st, w, dn, rec);
            const wo = L.getWorkout(P, st, w, dn, 'tier_' + rec.k);
            body += `<div class="day done"><div class="dot">✓</div><div class="grow">
              <div><span class="hint">День ${dn}</span> <span class="sets">${fmtSets(planned, wo.amrapLast)}</span></div>
              <div class="hint small">сделано: ${rec.r.join(' · ')} = ${sum(rec.r)} · ${dateStr(rec.t)}</div></div></div>`;
          } else {
            const wo = L.getWorkout(P, st, w, dn);
            body += `<div class="day ${isNext ? 'next' : ''}"><div class="dot">${dn}</div><div class="grow">
              <span class="hint">День ${dn}</span> <span class="sets">${fmtSets(wo.sets, wo.amrapLast)}</span></div></div>`;
          }
        });
        const bm = wk.benchmark_test_after_week;
        if (bm) {
          const res = st.T[w];
          const fin = bm.target_reps != null;
          const isNextTest = act.type === 'test' && act.week === w;
          let txt;
          if (res && res.x) txt = `пропущен · уровень ${tn(res.n)}`;
          else if (res) txt = `${res.r} повт.${res.n ? ' → уровень ' + tn(res.n) : ''}`;
          else txt = fin ? `цель — ${bm.target_reps}` : 'после этой недели';
          body += `<div class="day ${res ? 'done' : (isNextTest ? 'next' : '')}"><div class="dot">${res ? '✓' : '★'}</div>
            <div class="grow"><b>${fin ? 'Финальный тест' : 'Контрольный тест ' + testNumber(P, w)}</b>
            <div class="hint small">${txt}</div></div>
            ${res && !fin ? `<button class="btn ghost small" data-act="open-test" data-w="${w}">Пересдать</button>` : ''}</div>`;
        }
        if (anyDone) body += `<div style="padding-top:6px"><button class="btn ghost small" data-act="repeat" data-w="${w}" style="padding-left:0">↺ Повторить неделю</button></div>`;
      }
      h += `<div class="card ${skipped ? 'dim' : ''}">
        <div class="week-head"><h3>Неделя ${w}</h3>
        ${skipped ? '<span class="badge mute">пропущена</span>' : `<span class="badge">Уровень ${tn(tier)}${prelim ? ' · предв.' : ''}</span>`}</div>${body}</div>`;
    });

    h += `<div style="display:grid;gap:8px;margin-top:8px">
      <button class="btn sec" data-act="stats"><span class="ico-inline" style="display:inline-block">${STATS_SVG}</span>Статистика</button>
      <button class="btn danger" data-act="restart">Начать заново</button></div>`;
    if (cta) h += bottom(cta);
    return h;
  };

  /* --- тренировка --- */
  function chipsHtml(wo, a) {
    return '<div class="chips full">' + wo.sets.map((n, j) => {
      const last = j === wo.sets.length - 1;
      if (j < a.i) return `<span class="chip ${a.r[j] < n ? 'low' : 'done'}">${a.r[j]}</span>`;
      const label = n + (last && wo.amrapLast ? '+' : '');
      return `<span class="chip ${j === a.i ? 'cur' : ''}">${label}</span>`;
    }).join('') + '</div>';
  }

  function ensureActive(st, id, w, d) {
    const k = L.key(w, d);
    if (!st.a || st.a.k !== k) {
      st.a = { k, i: 0, r: [], e: null, tot: 0 };
      persist(id);
    }
    return st.a;
  }

  VIEWS.workout = function (c) {
    const id = c.id, P = DATA[id], m = META[id], st = ST[id];
    const wo = L.getWorkout(P, st, c.w, c.d);
    const a = ensureActive(st, id, c.w, c.d);
    if (a.e && a.e <= Date.now()) { a.e = null; persist(id); }
    const n = wo.sets.length;
    const head = `${backLink()}<div class="hint small">${m.name} · Неделя ${c.w} · День ${c.d}</div>${chipsHtml(wo, a)}`;

    if (a.e) {
      const nextLast = a.i === n - 1;
      return `${head}
        <div class="center">
          <div class="hint">Отдых</div>
          <div class="ring-wrap">
            <svg viewBox="0 0 100 100"><circle class="ring-bg" cx="50" cy="50" r="45" fill="none" stroke-width="6"/>
            <circle class="ring-fg" id="ringfg" cx="50" cy="50" r="45" fill="none" stroke-width="6" stroke-linecap="round"
              stroke-dasharray="${RING}" stroke-dashoffset="0"/></svg>
            <div class="ring-text"><div class="t" id="tm">0:00</div><div class="hint small">осталось</div></div>
          </div>
          <div class="adj">
            <button class="btn sec" data-act="rest-adj" data-d="-15">− 15 с</button>
            <button class="btn sec" data-act="rest-adj" data-d="15">+ 15 с</button>
          </div>
          <div class="card mt"><div class="hint small">Следующий подход ${a.i + 1} из ${n}</div>
            <div style="font-size:44px;font-weight:800;line-height:1.1">${wo.sets[a.i]}${nextLast && wo.amrapLast ? '+' : ''}</div></div>
        </div>
        ${bottom('<button class="btn" data-act="rest-skip">Начать следующий подход</button>')}`;
    }

    const planned = wo.sets[a.i];
    const last = a.i === n - 1;
    const key = a.k + ':' + a.i;
    if (curRepsKey !== key) { curReps = planned; curRepsKey = key; }
    return `${head}
      <div class="card center">
        <div class="hint">Подход ${a.i + 1} из ${n}</div>
        <div class="target">${planned}${last && wo.amrapLast ? '+' : ''}</div>
        <div class="hint">${last && wo.amrapLast ? 'минимум — в последнем делайте до отказа' : 'повторений по плану'}</div>
      </div>
      <div class="card center">
        <div class="counter-label">Сколько получилось</div>
        <div class="stepper" style="margin-top:6px">
          <button data-act="rep" data-d="-1" aria-label="Минус">−</button>
          <div class="val" id="reps">${curReps}</div>
          <button data-act="rep" data-d="1" aria-label="Плюс">+</button>
        </div>
      </div>
      ${a.i > 0 ? '<button class="btn ghost small" data-act="undo">↶ Отменить прошлый подход</button>' : ''}
      ${bottom('<button class="btn" data-act="set-done">Подход выполнен</button>')}`;
  };
  AFTER.workout = function () {
    const c = cur(), st = ST[c.id];
    if (st && st.a && st.a.e) startTicker(c.id);
  };

  function stopTicker() { if (ticker) { clearInterval(ticker); ticker = null; } }
  function startTicker(id) {
    stopTicker();
    let lastSec = -1;
    const tm = document.getElementById('tm'), ring = document.getElementById('ringfg');
    function tick() {
      const st = ST[id], a = st && st.a;
      if (!a || !a.e || cur().v !== 'workout') return stopTicker();
      const left = a.e - Date.now();
      const secs = Math.max(0, Math.ceil(left / 1000));
      if (tm) tm.textContent = mmss(secs);
      const frac = Math.min(1, Math.max(0, left / (a.tot * 1000)));
      if (ring) ring.style.strokeDashoffset = String(RING * (1 - frac));
      if (secs > 0 && secs <= 3 && secs !== lastSec) haptic('i', 'light');
      lastSec = secs;
      if (left <= 0) {
        stopTicker();
        a.e = null;
        persist(id);
        beep(3);
        haptic('n', 'success');
        render();
      }
    }
    tick();
    ticker = setInterval(tick, 250);
  }

  VIEWS.summary = function (c) {
    const id = c.id, P = DATA[id], st = ST[id];
    const rec = st.d[L.key(c.w, c.d)];
    const wo = L.getWorkout(P, st, c.w, c.d, 'tier_' + rec.k);
    const total = sum(rec.r), plan = sum(wo.sets), sf = L.shortfalls(wo.sets, rec.r);
    const chips = '<div class="chips" style="justify-content:center">' + wo.sets.map((p, j) =>
      `<span class="chip ${rec.r[j] < p ? 'low' : 'done'}">${rec.r[j]}</span>`).join('') + '</div>';
    const act = L.nextAction(P, st);
    let next;
    if (act.type === 'workout') next = `Следующая: неделя ${act.week}, день ${act.day}.`;
    else if (act.type === 'test') next = 'Дальше — ' + (L.finalTarget(P, act.week) != null ? 'финальный' : 'контрольный') + ' тест.';
    else next = 'Программа завершена.';
    const msg = sf === 0
      ? 'Все подходы выполнены по плану. Отличная работа!'
      : `Подходов ниже плана: ${sf}. Если программа даётся тяжело, повторите эту неделю — кнопка есть в плане.`;
    return `<div class="big-emoji">${sf === 0 ? '🔥' : '✅'}</div>
      <h1 class="center">Тренировка завершена</h1>
      <p class="hint center">Неделя ${c.w} · День ${c.d}</p>
      <div class="tiles"><div class="tile"><div class="n">${total}</div><div class="hint small">повторений</div></div>
      <div class="tile"><div class="n">${plan}+</div><div class="hint small">по плану</div></div></div>
      <div class="card center">${chips}<p style="margin:8px 0 0">${msg}</p></div>
      <p class="hint center">${next} Отдохните хотя бы день.</p>
      ${bottom('<button class="btn" data-act="back">Готово</button>')}`;
  };

  /* --- контрольный тест --- */
  VIEWS.test = function (c) {
    const id = c.id, P = DATA[id], m = META[id], st = ST[id], w = c.w;
    const wk = L.weekDef(P, w);
    const bm = wk.benchmark_test_after_week;
    const fin = bm.target_reps != null;
    const res = st.T[w];
    const title = fin ? '🏁 Финальный тест' : `Контрольный тест ${testNumber(P, w)}`;

    if (c.res && res) {
      if (fin) {
        const ok = res.r >= bm.target_reps;
        return `<div class="big-emoji">${ok ? '🏆' : '💪'}</div>
          <h1 class="center">Результат: ${res.r}</h1>
          <div class="bar-track" style="height:10px"><div class="bar-fill" style="width:${Math.min(100, Math.round(res.r / bm.target_reps * 100))}%"></div></div>
          <p class="center" style="margin-top:12px">${ok ? `Цель ${bm.target_reps} достигнута. Поздравляем!` : `До цели ${bm.target_reps} осталось ${bm.target_reps - res.r}. Можно повторить 6-ю неделю и пересдать тест.`}</p>
          ${bottom('<button class="btn" data-act="back">К программе</button>')}`;
      }
      const prev = res.x ? '' : (res.r > st.m ? `<p class="hint center">Старт был ${st.m} — прогресс +${res.r - st.m}</p>` : '');
      return `<div class="big-emoji">✅</div>
        <h1 class="center">Результат: ${res.r}</h1>${prev}
        <div class="card center"><div class="hint small">Следующие недели</div>
        <div style="font-size:28px;font-weight:800">Уровень ${tn(res.n)}</div></div>
        ${bottom('<button class="btn" data-act="back">К программе</button>')}`;
    }

    const lastRes = res && res.r != null ? res.r : (L.bestMax(st) || m.defaultMax);
    let table = '';
    if (!fin) {
      const tr = L.transitionsFor(P, w);
      table = `<div class="card"><h3 style="margin-bottom:6px">Как выбирается уровень</h3>` +
        tr.map((x) => `<div class="logrow"><span>${levelRange(x)} повт.</span><b>уровень ${tn(x.next_tier)}</b></div>`).join('') + '</div>';
    }
    return `${backLink()}<h1>${title}</h1>
      <p class="hint">${fin
        ? `Отдохните 48–72 часа после последней тренировки, затем сделайте один подход до абсолютного отказа. Цель — ${bm.target_reps}.`
        : 'Отдохните 24–48 часов после последней тренировки, затем сделайте один подход до отказа — чисто, без рывков.'}</p>
      <div class="card center"><h3>Ваш результат</h3>${stepperInput('num', lastRes)}</div>
      ${table}
      ${bottom(`<button class="btn" data-act="test-save" data-w="${w}">Сохранить результат</button>` +
        (fin ? '' : `<button class="btn ghost" data-act="test-skip" data-w="${w}">Пропустить тест</button>`))}`;
  };

  /* --- статистика --- */
  function chartSvg(P, st) {
    const goal = L.finalTarget(P, 6);
    const pts = [{ l: 'Старт', v: st.m }];
    P.weeks.forEach((wk) => {
      const b = wk.benchmark_test_after_week, r = st.T[wk.week_number];
      if (b && r && r.r != null) pts.push({ l: b.target_reps != null ? 'Финал' : 'Т' + testNumber(P, wk.week_number), v: r.r });
    });
    const W = 320, H = 180, top = 26, base = 150;
    const max = Math.max(goal, ...pts.map((p) => p.v));
    const y = (v) => base - (v / max) * (base - top);
    const slot = (W - 16) / pts.length, bw = Math.min(46, slot * 0.62);
    let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Максимум повторений по тестам">`;
    s += `<line class="goal" x1="8" x2="${W - 8}" y1="${y(goal)}" y2="${y(goal)}"/><text class="goal-t" x="${W - 8}" y="${y(goal) - 5}" text-anchor="end">цель ${goal}</text>`;
    pts.forEach((p, i) => {
      const x = 8 + slot * i + (slot - bw) / 2, yy = y(p.v);
      s += `<rect class="bar" x="${x}" y="${yy}" width="${bw}" height="${base - yy}" rx="6"/>
        <text class="v" x="${x + bw / 2}" y="${yy - 5}" text-anchor="middle">${p.v}</text>
        <text x="${x + bw / 2}" y="${base + 16}" text-anchor="middle">${p.l}</text>`;
    });
    return s + '</svg>';
  }

  VIEWS.stats = function (c) {
    const id = c.id, P = DATA[id], st = ST[id];
    const done = L.doneWorkouts(P, st), total = L.totalWorkouts(P, st);
    const days = Math.floor((Date.now() - st.s0) / 864e5) + 1;
    const entries = Object.keys(st.d).map((k) => {
      const [w, d] = k.split('-').map(Number);
      return { w, d, rec: st.d[k] };
    }).sort((a, b) => b.rec.t - a.rec.t);
    const log = entries.length ? entries.map((e) => {
      const plan = sum(L.plannedFor(P, st, e.w, e.d, e.rec));
      return `<div class="logrow"><span>Нед. ${e.w} · День ${e.d} <span class="hint small">${dateStr(e.rec.t)}</span></span><span><b>${sum(e.rec.r)}</b> <span class="hint small">/ ${plan}+</span></span></div>`;
    }).join('') : '<p class="hint">Пока нет выполненных тренировок.</p>';
    return `${backLink()}<div class="row" style="margin-bottom:4px"><div class="ico lg">${STATS_SVG}</div><div class="grow"><div class="hint small">Статистика</div><h1>${META[id].name}</h1></div></div>
      <div class="tiles" style="margin-top:12px">
        <div class="tile"><div class="n">${done}/${total}</div><div class="hint small">тренировок</div></div>
        <div class="tile"><div class="n">${L.totalReps(st)}</div><div class="hint small">повторений всего</div></div>
        <div class="tile"><div class="n">${L.bestMax(st)}</div><div class="hint small">лучший максимум</div></div>
        <div class="tile"><div class="n">${days}</div><div class="hint small">день с начала</div></div>
      </div>
      <div class="card"><h3 style="margin-bottom:6px">Максимум за подход</h3>${chartSvg(P, st)}</div>
      <h2>Журнал</h2><div class="card">${log}</div>`;
  };

  /* ---------- отрисовка ---------- */
  function render() {
    stopTicker();
    const c = cur();
    app.innerHTML = '<div class="fade">' + VIEWS[c.v](c) + '</div>';
    window.scrollTo(0, 0);
    if (tg && tg.BackButton) {
      try { if (stack.length > 1) tg.BackButton.show(); else tg.BackButton.hide(); } catch (e) { /* ignore */ }
    }
    if (c.v === 'workout') lockScreen(); else unlockScreen();
    if (AFTER[c.v]) AFTER[c.v](c);
  }

  /* ---------- действия ---------- */
  const readNum = () => {
    const el = document.getElementById('num');
    const n = el ? parseInt(el.value, 10) : NaN;
    return isNaN(n) ? null : Math.max(0, Math.min(999, n));
  };

  const ACTIONS = {
    back: () => back(),

    open: (d) => {
      if (!ST[d.id]) go('setup', { id: d.id }); else go('program', { id: d.id });
    },

    step: (d) => {
      const el = document.getElementById(d.t);
      if (!el) return;
      el.value = Math.max(0, Math.min(999, (parseInt(el.value, 10) || 0) + parseInt(d.d, 10)));
      haptic('i', 'light');
      if (cur().v === 'setup') updateTierPrev();
    },

    start: () => {
      const id = cur().id, n = readNum();
      if (n === null) return notify('Введите число повторений.');
      ST[id] = L.newState(DATA[id], n, Date.now());
      persist(id);
      haptic('n', 'success');
      resetTo([{ v: 'home' }, { v: 'program', id }]);
    },

    stats: () => go('stats', { id: cur().id }),

    'start-workout': (d) => {
      unlockAudio();
      go('workout', { id: cur().id, w: +d.w, d: +d.d });
    },

    rep: (d) => {
      curReps = Math.max(0, Math.min(999, curReps + parseInt(d.d, 10)));
      const el = document.getElementById('reps');
      if (el) el.textContent = curReps;
      haptic('i', 'light');
    },

    'set-done': () => {
      unlockAudio();
      const c = cur(), id = c.id, P = DATA[id], st = ST[id];
      const wo = L.getWorkout(P, st, c.w, c.d), a = st.a;
      a.r.push(curReps);
      a.i += 1;
      haptic('i', 'medium');
      if (a.i >= wo.sets.length) {
        L.completeWorkout(P, st, c.w, c.d, a.r, Date.now());
        persist(id);
        haptic('n', 'success');
        return replace('summary', { id, w: c.w, d: c.d });
      }
      const secs = wo.rest[a.i - 1] != null ? wo.rest[a.i - 1] : 60;
      a.e = Date.now() + secs * 1000;
      a.tot = secs;
      persist(id);
      render();
    },

    undo: () => {
      const c = cur(), st = ST[c.id], a = st.a;
      if (!a || a.i === 0) return;
      a.i -= 1; a.r.pop(); a.e = null;
      curRepsKey = '';
      persist(c.id);
      render();
    },

    'rest-adj': (d) => {
      const c = cur(), st = ST[c.id], a = st.a;
      if (!a || !a.e) return;
      const delta = parseInt(d.d, 10);
      a.e = Math.max(Date.now() + 1000, a.e + delta * 1000);
      a.tot = Math.max(5, a.tot + delta);
      haptic('i', 'light');
      persist(c.id);
      startTicker(c.id);
    },

    'rest-skip': () => {
      const c = cur(), st = ST[c.id];
      if (st.a) st.a.e = null;
      persist(c.id);
      render();
    },

    'open-test': (d) => go('test', { id: cur().id, w: +d.w }),

    'test-save': (d) => {
      const c = cur(), P = DATA[c.id], st = ST[c.id], n = readNum();
      if (n === null) return notify('Введите число повторений.');
      L.applyTest(P, st, +d.w, n, Date.now());
      persist(c.id);
      haptic('n', 'success');
      replace('test', { id: c.id, w: +d.w, res: 1 });
    },

    'test-skip': (d) => {
      const c = cur();
      confirmBox('Пропустить тест? Уровень останется прежним.', () => {
        L.skipTest(DATA[c.id], ST[c.id], +d.w, Date.now());
        persist(c.id);
        back();
      }, 'Пропустить');
    },

    repeat: (d) => {
      const c = cur(), w = +d.w;
      confirmBox(`Повторить неделю ${w}? Выполненные тренировки этой недели будут сброшены (повторения останутся в общей статистике).`, () => {
        L.resetWeek(DATA[c.id], ST[c.id], w, Date.now());
        persist(c.id);
        render();
      }, 'Повторить неделю');
    },

    restart: () => {
      const id = cur().id;
      confirmBox(`Удалить прогресс «${META[id].name}» и начать заново?`, () => {
        ST[id] = null;
        persist(id);
        resetTo([{ v: 'home' }, { v: 'setup', id }]);
      }, 'Удалить прогресс', true);
    }
  };

  app.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const fn = ACTIONS[b.dataset.act];
    if (fn) fn(b.dataset);
  });
  app.addEventListener('input', (e) => {
    if (e.target.id === 'num' && cur().v === 'setup') updateTierPrev();
  });
  app.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && e.target.id === 'num') e.target.blur();
  });
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && cur().v === 'workout') render();
  });

  /* ---------- старт ---------- */
  function applyTheme() {
    // Своя чёрная тема независимо от темы Telegram
    try { tg.setHeaderColor('#000000'); } catch (e) { /* ignore */ }
    try { tg.setBackgroundColor('#000000'); } catch (e) { /* ignore */ }
    try { if (tg.setBottomBarColor) tg.setBottomBarColor('#000000'); } catch (e) { /* ignore */ }
  }

  function init() {
    if (tg) {
      try { tg.ready(); tg.expand(); } catch (e) { /* ignore */ }
      try { if (tg.isVersionAtLeast('7.7')) tg.disableVerticalSwipes(); } catch (e) { /* ignore */ }
      try { if (tg.BackButton) tg.BackButton.onClick(back); } catch (e) { /* ignore */ }
      try { tg.onEvent('themeChanged', applyTheme); } catch (e) { /* ignore */ }
      applyTheme();
    }
    app.innerHTML = '<p class="hint center" style="padding-top:40vh">Загрузка…</p>';
    loadAll().then(render);
  }

  window.__app = { ST, ACTIONS, go, back, render, cur, VIEWS }; // для отладки
  init();
})();

</script>
</body>
</html>
